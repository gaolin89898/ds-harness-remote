name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true

jobs:
  release:
    name: Build and publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.9.0
          cache: pnpm

      - name: Validate version tag
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises'

          const readJson = async (path) => JSON.parse(await readFile(path, 'utf8'))
          const root = await readJson('package.json')
          const plugin = await readJson('packages/plugin/package.json')
          const tui = await readJson('packages/tui/package.json')
          const versions = new Set([root.version, plugin.version, tui.version])
          if (tui.dependencies['ds-harness-remote'] !== `workspace:${plugin.version}`) {
            throw new Error('TUI must depend on the matching Remote workspace version.')
          }
          const expectedTag = `v${plugin.version}`

          if (versions.size !== 1) {
            throw new Error(`Release versions do not match: ${[...versions].join(', ')}`)
          }
          if (process.env.GITHUB_REF_NAME !== expectedTag) {
            throw new Error(`Expected tag ${expectedTag}, received ${process.env.GITHUB_REF_NAME}`)
          }
          NODE

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: |
          pnpm --filter './packages/**' -r build
          pnpm -r check

      - name: Run tests
        run: pnpm -r test

      - name: Build workspace
        run: NODE_ENV=production pnpm --workspace-concurrency=1 -r build

      - name: Verify production Plugin bundles
        run: |
          git diff --exit-code -- packages/plugin/dist/index.js packages/plugin/dist/client.github.js
          node scripts/verify-dsh-plugin.mjs

      - name: Pack plugin
        run: |
          mkdir -p release-assets
          pnpm --dir packages/plugin pack --pack-destination "$GITHUB_WORKSPACE/release-assets"

      - name: Stage release assets
        run: |
          cp "release-assets/ds-harness-remote-${GITHUB_REF_NAME#v}.tgz" release-assets/dsh-kite.tgz
          cd release-assets
          sha256sum *.tgz > SHA256SUMS.txt

      - name: Build and package browser extension
        run: |
          NODE_ENV=production pnpm --dir apps/browser build
          mkdir -p release-assets/browser-extension
          cd apps/browser
          zip -qr "$GITHUB_WORKSPACE/release-assets/dsh-remote-browser-${GITHUB_REF_NAME}.zip" \
            manifest.json popup.html styles.css media _locales dist

      - name: Update release checksums
        run: |
          cd release-assets
          sha256sum *.tgz *.zip > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: dsh-kite ${{ github.ref_name }}
          files: release-assets/*
          fail_on_unmatched_files: true
          body_path: .github/release-notes.md
          generate_release_notes: false
